name: test

on:
  pull_request:
  push:
    branches: ["**"]

jobs:
  swift:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
